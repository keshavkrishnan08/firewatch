[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firewatch"
version = "0.1.0"
description = "Real-time wildfire common operating picture: assimilate camera+satellite observations into a calibrated probabilistic spread forecast and a human-in-the-loop decision layer."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Keshav Krishnan" }]
keywords = ["wildfire", "data-assimilation", "geospatial", "forecasting", "common-operating-picture"]

# Runtime deps are pinned in requirements.txt for reproducibility.
# This list is the minimal import surface for `pip install -e .`.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2",
  "requests>=2.31",
  "shapely>=2.0",
  "pyproj>=3.6",
  "duckdb>=0.10",
  "pyarrow>=14",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
# Heavy / feed-specific extras. Core forecast + decision + georeference run without these.
geo = ["rasterio>=1.3", "geopandas>=0.14", "xarray>=2024.1", "rioxarray"]
sat = ["goes2go", "herbie-data", "cfgrib", "eccodes", "s3fs", "netCDF4", "h5py", "h5netcdf"]
osm = ["osmnx>=1.9"]
perception = ["opencv-python", "Pillow"]
# ML: learned surrogate + real YOLO/SAM2 detection (torch has py3.14 wheels; MPS/CUDA optional):
ml = ["torch>=2.2", "torchvision", "ultralytics", "scikit-learn"]
accel = ["numba>=0.59"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
firewatch = "firewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "web", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; long strings/URLs tolerated

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: longer-running tests (model training, large grids)"]
